name: Build & Deploy

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/weblog-api

jobs:
  # ── Job 1: Build Docker image and push to Docker Hub ────────────────────────
  build:
    name: Build & Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 2: SSH into EC2, pull image, restart container ──────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build   # only runs if build succeeds

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Pull the latest image
            docker pull ${{ env.IMAGE_NAME }}:latest

            # Stop and remove the old container (ignore errors if not running)
            docker stop weblogs-api || true
            docker rm   weblogs-api || true

            # Start the new container
            # -p 127.0.0.1:8080:8080 binds to localhost ONLY — Nginx proxies it
            docker run -d \
              --name weblogs-api \
              --restart=always \
              --env-file /home/ubuntu/blog/.env.prod \
              -p 127.0.0.1:8080:8080 \
              ${{ env.IMAGE_NAME }}:latest

            # Wait for the app to be healthy (up to 120 seconds)
            echo "Waiting for health check..."
            for i in $(seq 1 24); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "✅ App is healthy after $((i * 5)) seconds"
                exit 0
              fi
              echo "Attempt $i/24 — status $STATUS — retrying in 5s..."
              sleep 5
            done
            echo "❌ Health check timed out after 120 seconds"
            docker logs --tail=50 weblogs-api
            exit 1

      - name: Notify success
        if: success()
        run: echo "🚀 Deployed successfully to EC2"
