spring:
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  mail:
    host: localhost
    port: 25
    username: test
    password: test
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope:
              - email
              - profile
          github:
            client-id: test-github-id
            client-secret: test-github-secret
            scope:
              - read:user
              - user:email

jwt:
  secret: dGVzdC1zZWNyZXQtZm9yLWludGVncmF0aW9uLXRlc3RzLW11c3QtYmUtYXQtbGVhc3QtNjQtYnl0ZXMtbG9uZw==
  access-token-expiry: PT15M
  refresh-token-expiry: P30D

app:
  frontend-url: http://localhost:3000
  mail:
    from: noreply@test.com
  rate-limit:
    login:
      max-attempts: 100
      window-seconds: 60
  cloudinary:
    cloud-name: test-cloud
    api-key: test-key
    api-secret: test-secret
