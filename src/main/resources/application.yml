spring:
  application:
    name: blog

  # ── Datasource ──────────────────────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/blog}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  # ── JPA ─────────────────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  # ── Flyway ──────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # ── Redis (plain data-redis — no server-side sessions) ──────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

  # ── Spring Session DISABLED — we use stateless JWT ──────────────────────────
  session:
    store-type: none

  # ── OAuth2 ──────────────────────────────────────────────────────────────────
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            # Registered redirect URI in Google Console:
            # http://localhost:8080/login/oauth2/code/google
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - read:user
              - user:email
            # Registered redirect URI in GitHub App:
            # http://localhost:8080/login/oauth2/code/github

  # ── Mail (SMTP) ──────────────────────────────────────────────────────────────
  mail:
    host: ${MAIL_HOST:smtp.mailtrap.io}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

# ── JWT ─────────────────────────────────────────────────────────────────────
jwt:
  # Generate with: openssl rand -base64 64
  secret: ${JWT_SECRET}
  access-token-expiry: PT15M     # 15 minutes (ISO-8601 duration)
  refresh-token-expiry: P30D     # 30 days

# ── App Custom Properties ────────────────────────────────────────────────────
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:noreply@weblogs.com}
  rate-limit:
    login:
      max-attempts: ${RATE_LIMIT_LOGIN_MAX:5}
      window-seconds: ${RATE_LIMIT_LOGIN_WINDOW:60}

# ── Logging ─────────────────────────────────────────────────────────────────
logging:
  level:
    com.weblogs.blog: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
