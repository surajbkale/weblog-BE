spring:
  application:
    name: blog

# ── Server / Proxy ────────────────────────────────────────────────────────────
# CRITICAL for OAuth2 behind Nginx (or any reverse proxy with SSL termination).
# Without this, Spring Boot only sees the internal HTTP connection from Nginx
# and generates `http://` redirect URIs.  Google (and GitHub) then reject them
# because you registered `https://` URIs in their consoles.
#
# `framework` tells Spring to read X-Forwarded-Proto / X-Forwarded-Host headers
# set by Nginx, so all generated URLs (including OAuth2 redirect_uri) use the
# correct external scheme and host.
server:
  forward-headers-strategy: framework

  # ── Datasource ──────────────────────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/blog}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:4}  # Neon free tier: max 5 connections
      minimum-idle: 1
      connection-timeout: 30000

  # ── JPA ─────────────────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  # ── Flyway ──────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    out-of-order: false            # never run migrations out of version order
    validate-on-migrate: true      # default, but explicit for clarity
    connect-retries: 5             # retry DB connection if Neon compute is waking up
    # IMPORTANT: Must use the DIRECT (non-pooler) Neon endpoint here.
    # Neon's connection pooler (PgBouncer) runs in transaction mode which breaks
    # Flyway's session-level advisory locks, causing migrations to be silently skipped.
    # Set FLYWAY_URL in Render to the direct endpoint (without -pooler in the hostname).
    url: ${FLYWAY_URL:${spring.datasource.url}}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}


  # ── Redis (plain data-redis — no server-side sessions) ──────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}   # set true for Upstash (TLS required)
      timeout: 3000ms

  # ── Spring Session DISABLED — we use stateless JWT ──────────────────────────
  session:
    store-type: none

  # ── OAuth2 ──────────────────────────────────────────────────────────────────
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            # Registered redirect URI in Google Console:
            # http://localhost:8080/login/oauth2/code/google
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - read:user
              - user:email
            # Registered redirect URI in GitHub App:
            # http://localhost:8080/login/oauth2/code/github

  # ── Mail (SMTP) ──────────────────────────────────────────────────────────────
  mail:
    host: ${MAIL_HOST:smtp.mailtrap.io}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  # ── Multipart (images up to 5 MB, videos up to 50 MB) ─────────────────────
  servlet:
    multipart:
      max-file-size: 250MB
      max-request-size: 251MB

# ── JWT ─────────────────────────────────────────────────────────────────────
jwt:
  # Generate with: openssl rand -base64 64
  secret: ${JWT_SECRET}
  access-token-expiry: PT15M     # 15 minutes (ISO-8601 duration)
  refresh-token-expiry: P30D     # 30 days

# ── App Custom Properties ────────────────────────────────────────────────────
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  site-url: ${SITE_URL:http://localhost:8080}
  # Set COOKIES_SECURE=false in .env for local plain-HTTP dev.
  # Always leave true in production (HTTPS).
  cookies:
    secure: ${COOKIES_SECURE:true}
  mail:
    from: ${MAIL_FROM:noreply@weblogs.com}
  rate-limit:
    login:
      max-attempts: ${RATE_LIMIT_LOGIN_MAX:5}
      window-seconds: ${RATE_LIMIT_LOGIN_WINDOW:60}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  cache:
    post-list-ttl-seconds: 300        # 5 min — public post list
    post-by-slug-ttl-seconds: 600     # 10 min — single post
    tags-ttl-seconds: 3600            # 1 hr — tag list (rarely changes)
    categories-ttl-seconds: 3600      # 1 hr — category list
    view-flush-interval-ms: 300000    # 5 min — how often view counts flush to DB
    trending-ttl-seconds: 300         # 5 min — trending post list
    featured-ttl-seconds: 600         # 10 min — featured post list
    trending-window-days: 7           # posts published within N days are eligible
    trending-limit: 10                # max posts in trending response
    featured-limit: 10                # max posts in featured response
    feed-limit: 20                    # posts included in RSS feed

  # ── Media upload size limits (single source of truth) ───────────────────────
  # MediaService reads these values. The spring.servlet.multipart limits above
  # are intentionally set slightly higher so Spring's HTTP layer never rejects a
  # request before our application-level validation can return a proper error.
  media:
    image-max-size-bytes: 5242880     # 5 MB  (5 * 1024 * 1024)
    video-max-size-bytes: 262144000    # 250 MB (250 * 1024 * 1024)


# ── Actuator ────────────────────────────────────────────────────────────────
# Only expose /actuator/health — used by UptimeRobot keep-alive ping.
# All other endpoints are disabled to avoid leaking internal information.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never   # don't expose DB/Redis status to the public

# ── Logging ─────────────────────────────────────────────────────────────────
logging:
  level:
    com.weblogs.blog: ${LOG_LEVEL:INFO}   # override with LOG_LEVEL=DEBUG locally
    org.springframework.security: WARN
    org.flywaydb: INFO
